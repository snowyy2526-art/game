<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flora Tímida · estudo de camuflagem</title>
<style>
  *{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#151914;color:#c8c6ac;font-family:Georgia,serif;overflow:hidden}canvas{display:block}
  header{position:absolute;z-index:2;top:25px;left:32px;right:32px;display:flex;justify-content:space-between;align-items:center;pointer-events:none}h1{font-size:27px;font-weight:400;margin:0;letter-spacing:2px}header span,footer{font:10px monospace;letter-spacing:2px}
  footer{position:absolute;z-index:2;bottom:25px;left:0;right:0;display:grid;grid-template-columns:repeat(3,1fr);text-align:center;pointer-events:none}
</style>
<header><h1>A FLORA TÍMIDA</h1><span>ESTUDO DO MODELO E DA CAMUFLAGEM</span></header>
<footer><span>POSTURA ATIVA · 4,5 M</span><span>POSTURA DE CAMUFLAGEM</span><span>ÁRVORE DA FLORESTA</span></footer>
<script type="module">
import * as THREE from 'three';
import {createFloraModel} from '../../models/flora.js';
import {createWoodlandTreeGeometry} from '../../models/woodland.js';
import {createWorld} from '../../world.js';
const params=new URLSearchParams(location.search),field=params.has('forest'),moving=params.has('moving');
const renderer=new THREE.WebGLRenderer({antialias:false,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;
document.body.appendChild(renderer.domElement);
function studio(){
 const scene=new THREE.Scene();scene.background=new THREE.Color(0x151914);
 scene.add(new THREE.HemisphereLight(0xc6d5bc,0x3d2b1e,1.5));
 const light=new THREE.DirectionalLight(0xe8c697,2.7);light.position.set(-5,7,6);scene.add(light);
 const rim=new THREE.DirectionalLight(0x9aafba,1.9);rim.position.set(3,5,-4);scene.add(rim);
 return scene;
}
const active=createFloraModel(THREE),camouflaged=createFloraModel(THREE);
active.setCamouflaged(false);camouflaged.setCamouflaged(true);
const scenes=[studio(),studio(),studio()];scenes[0].add(active.group);scenes[1].add(camouflaged.group);
const tree=new THREE.Mesh(createWoodlandTreeGeometry(THREE,{seed:3,height:5.8}),new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,vertexColors:true,side:THREE.DoubleSide}));scenes[2].add(tree);
const cameras=scenes.map(()=>{
 const h=3.4,aspect=innerWidth/3/innerHeight;
 const camera=new THREE.OrthographicCamera(-h*aspect,h*aspect,h,-h,.1,60);
 camera.position.set(0,3.25,12);camera.lookAt(0,2.9,0);return camera;
});
let world=null;
if(field){
 document.querySelector('header span').textContent='INTEGRADA À FLORESTA';document.querySelector('footer').hidden=true;
 const scene=scenes[0];scene.clear();scene.background=new THREE.Color(0x344136);scene.fog=new THREE.FogExp2(0x344136,.019);
 scene.add(new THREE.HemisphereLight(0xb5cbc0,0x26281d,1.8));const sun=new THREE.DirectionalLight(0xd9d7ad,2.6);sun.position.set(-20,40,12);scene.add(sun);
 world=createWorld(THREE,scene,{lowQuality:true});world.update(0,{time:12,phase:'day',fire:45});
 camouflaged.group.position.set(-15,0,-15);scene.add(camouflaged.group);
 const c=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,180);c.position.set(-11,1.7,-7.5);c.lookAt(-15,2.7,-15);cameras[0]=c;
}
let frames=0;
function render(ms=0){
 if(moving)active.animate(ms/1000,true,false);
 renderer.setScissorTest(!field);
 if(field){renderer.setViewport(0,0,innerWidth,innerHeight);renderer.render(scenes[0],cameras[0]);}
 else for(let i=0;i<3;i++){const w=Math.floor(innerWidth/3);renderer.setViewport(i*w,0,w,innerHeight);renderer.setScissor(i*w,0,w,innerHeight);renderer.render(scenes[i],cameras[i]);}
 frames++;if(moving)requestAnimationFrame(render);
}
render();window.__floraPreview={active,camouflaged,tree,world,scenes,cameras,renderer,render,get frames(){return frames;}};
</script></html>
